version: '3.8'

services:
  # Nginx - Servidor web
  nginx:
    image: nginx:1.25-alpine
    container_name: facturacheck-nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - facturacheck-network
    restart: unless-stopped

  # PHP 8.4 FPM
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: facturacheck-php
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_MAX_FILESIZE=50M
      - PHP_POST_MAX_SIZE=50M
    depends_on:
      - mysql
      - redis
    networks:
      - facturacheck-network
    restart: unless-stopped

  # MySQL 8.4
  mysql:
    image: mysql:8.4
    container_name: facturacheck-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-facturacheck}
      MYSQL_USER: ${DB_USER:-facturacheck}
      MYSQL_PASSWORD: ${DB_PASSWORD:-facturacheck}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - facturacheck-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis
  redis:
    image: redis:7-alpine
    container_name: facturacheck-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - facturacheck-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # phpMyAdmin (opcional - para gestión de BD)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: facturacheck-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-facturacheck}
      PMA_PASSWORD: ${DB_PASSWORD:-facturacheck}
    depends_on:
      - mysql
    networks:
      - facturacheck-network
    restart: unless-stopped

networks:
  facturacheck-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
