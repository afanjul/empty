server {
    listen 80;
    server_name localhost;

    charset utf-8;
    client_max_body_size 50M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Backend admin
    location ^~ /admin {
        alias /var/www/html/backend/web;

        # Strip /admin prefix and pass to backend
        if ($request_uri ~ ^/admin(.*)$) {
            set $backend_uri $1;
        }

        # Default to / if no path after /admin
        if ($backend_uri = "") {
            set $backend_uri "/";
        }

        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/web/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $backend_uri;
        include fastcgi_params;
    }

    # API REST
    location ^~ /api {
        alias /var/www/html/api/web;

        # Strip /api prefix and pass to API
        if ($request_uri ~ ^/api(.*)$) {
            set $api_uri $1;
        }

        # Default to / if no path after /api
        if ($api_uri = "") {
            set $api_uri "/";
        }

        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/web/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $api_uri;
        include fastcgi_params;
    }

    # Frontend application (default)
    location / {
        root /var/www/html/frontend/web;
        try_files $uri $uri/ /index.php?$args;

        location ~ \.php$ {
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ ^/(composer\.|package\.|\.env|\.git) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
