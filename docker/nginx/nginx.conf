server {
    listen 80;
    server_name localhost;

    charset utf-8;
    client_max_body_size 50M;

    root /var/www/html;
    index index.php index.html;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Backend admin
    location ^~ /admin {
        rewrite ^/admin(/.*)?$ /backend-entry.php$1 last;
    }

    # API REST
    location ^~ /api {
        rewrite ^/api(/.*)?$ /api-entry.php$1 last;
    }

    # Backend admin entry point (must come before general PHP handler)
    location ~ ^/backend-entry\.php {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/web/index.php;
        fastcgi_param SCRIPT_NAME /admin/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    # API entry point (must come before general PHP handler)
    location ~ ^/api-entry\.php {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/web/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    # Frontend application (default)
    location / {
        root /var/www/html/frontend/web;
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP processing for frontend
    location ~ \.php$ {
        root /var/www/html/frontend/web;
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ ^/(composer\.|package\.|\.env|\.git) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
